server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing - any path that isn't a real
    # file needs to fall back to index.html so React Router can handle
    # it, instead of nginx returning a 404 for e.g. a direct visit to
    # /history or a page refresh on a non-root route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets (Vite adds content
    # hashes to filenames, so these are safe to cache aggressively).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
